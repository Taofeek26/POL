<button class="theme-toggle" type="button" onclick="(function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark')})()">Light / dark</button>
<script>
// Wrap the contents list and the body in a two-column layout.
(function(){var toc=document.getElementById('TOC');if(!toc)return;var main=document.createElement('main');var hdr=document.getElementById('title-block-header');var nodes=[].slice.call(document.body.childNodes);var layout=document.createElement('div');layout.className='layout';nodes.forEach(function(n){if(n!==toc&&!(n.classList&&n.classList.contains('theme-toggle'))&&n.nodeName!=='SCRIPT')main.appendChild(n)});var d=document.createElement('details');var sm=document.createElement('summary');sm.textContent='Contents';d.appendChild(sm);while(toc.firstChild)d.appendChild(toc.firstChild);toc.appendChild(d);if(matchMedia('(min-width: 901px)').matches)d.open=true;toc.addEventListener('click',function(e){if(e.target.tagName==='A'&&!matchMedia('(min-width: 901px)').matches)d.open=false});layout.appendChild(toc);layout.appendChild(main);document.body.insertBefore(layout,document.body.firstChild);})();
</script>
