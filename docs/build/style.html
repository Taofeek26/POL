<style>
:root{--bg:#f7f7f4;--surface:#fff;--text:#1d2125;--muted:#5b636b;--border:#e1e3e0;--accent:#0f6b4f;--accent-soft:#e3f1ec;--code:#f0f1ee;--th:#eef2ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121514;--surface:#1a1e1c;--text:#e6e9e7;--muted:#a0a8a4;--border:#2c3330;--accent:#4fc597;--accent-soft:#1e3a2f;--code:#222826;--th:#212826}}
:root[data-theme="dark"]{--bg:#121514;--surface:#1a1e1c;--text:#e6e9e7;--muted:#a0a8a4;--border:#2c3330;--accent:#4fc597;--accent-soft:#1e3a2f;--code:#222826;--th:#212826}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:none;padding:0}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;min-height:100vh}
nav#TOC{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:24px 18px;font-size:14px}
nav#TOC summary{cursor:pointer;display:block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
nav#TOC ul{list-style:none;padding-left:0;margin:0}
nav#TOC ul ul{padding-left:14px;display:none}
nav#TOC li{margin:3px 0}
nav#TOC a{color:var(--text);text-decoration:none;display:block;padding:3px 6px;border-radius:6px}
nav#TOC a:hover{background:var(--accent-soft);color:var(--accent)}
main{padding:40px 48px 80px;max-width:1000px;width:100%}
header#title-block-header{background:var(--accent);color:#fff;margin:-40px -48px 32px;padding:48px 48px 36px}
header#title-block-header{text-align:left}
header#title-block-header h1{margin:0;font-size:2.4rem;border:0;color:#fff}
header .subtitle{font-size:1.15rem;opacity:.92;margin:8px 0 6px}
header .date{opacity:.8;font-size:.95rem;margin:0}
h1{font-size:1.75rem;margin:56px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--accent);scroll-margin-top:16px}
h2{font-size:1.3rem;margin:36px 0 12px;color:var(--accent);scroll-margin-top:16px}
h3{font-size:1.1rem;margin:24px 0 8px}
a{color:var(--accent)}
p,li{max-width:75ch}
table{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:14.5px;background:var(--surface);display:block;overflow-x:auto;width:max-content;max-width:100%}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--th);font-weight:600}
tbody tr:hover{background:var(--accent-soft)}
blockquote{margin:16px 0;padding:12px 18px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 8px 8px 0}
blockquote p{margin:6px 0}
pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.5}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
pre code{background:none;padding:0}
hr{border:0;border-top:1px solid var(--border);margin:40px 0}
ul.task-list{list-style:none;padding-left:4px}
input[type=checkbox]{accent-color:var(--accent);margin-right:8px}
.theme-toggle{position:fixed;top:14px;right:16px;z-index:5;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
@media (max-width:900px){.layout{display:flex;flex-direction:column}main{order:1}nav#TOC{order:2;position:fixed!important;inset:auto 0 0 0;max-height:70vh;z-index:4;box-shadow:0 -4px 16px rgba(0,0,0,.15)}nav#TOC details:not([open]) summary{padding:4px 0}nav#TOC{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:16px}main{padding:24px 16px 60px}header#title-block-header{margin:-24px -16px 24px;padding:36px 16px 24px}header#title-block-header h1{font-size:1.8rem}.theme-toggle{top:10px;right:10px}main{padding-bottom:90px}}
@media print{nav#TOC,.theme-toggle{display:none}.layout{display:block}main{max-width:none}}
</style>
